name: Release Windows
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [preview, stable]
        default: preview
permissions:
  contents: read
concurrency:
  group: nuvokit-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo test --release --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo clippy --release --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run setup:test
      - name: Build signed update and native setup
        run: npm run desktop:bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify signed package without installing
        run: node scripts/verify-updater.mjs local
      - run: npm run uninstall:test
      - name: Publish release and update channel feed
        run: node scripts/publish-release.mjs '${{ inputs.channel }}'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify published GitHub feed and signed download
        run: node scripts/verify-updater.mjs remote
